url: https://hanbyul-lee.github.io/spacelink/
template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "spacelink: Multi-Scale Spatial Gene Variability Analysis"
  description: >
    Statistical methods for analyzing spatial gene expression patterns
    across multiple scales, with applications to understanding developmental
    processes and disease mechanisms.

navbar:
  structure:
    left:  [home, getting_started, simulation_studies, real_data, data_browser, tutorials]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    getting_started:
      text: Getting started
      menu:
      - text: Installation
        href: articles/installation.html
      - text: Quick start
        href: articles/quick_start.html
      - text: Overview of Spacelink main functions
        href: articles/overview.html
      - text: Package index
        href: reference/index.html
    simulation_studies:
      text: Simulation studies
      menu:
      - text: Simulation examples
      - text: Spacelink global SVG
        href: articles/spacelink_vignette.html
      - text: Spacelink ctSVG
        href: articles/spacelink_ctSVG_vignette.html
      - text: "-------"
      - text: Benchmarks
      - text: Lengthscale estimation
        href: articles/lengthscale_estimation.html
      - text: Runtime and memory usage
        href: articles/runtime_memory_usage.html
    real_data:
      text: Real data analyses
      menu:
      - text: CosMx human frontal cortex analysis
        href: articles/illustration_on_cosmx_data.html
      - text: Visium human DLPFC analysis
        href: articles/illustration_on_visium_data.html
      - text: Disease informativeness evaluation of ESV
        href: articles/disease_informativeness_evaluation.html
      - text: Alzheimer’s disease data analysis
        href: articles/AD_data_analysis.html
    data_browser:
      text: Data browser
      href: articles/data_browser.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/hanbyul-lee/spacelink
      aria-label: GitHub

articles:
- title: "Getting Started"
  desc: "Installation and overview of the package"
  contents:
  - installation
  - quick_start
  - overview

- title: "Simulation studies"
  desc: "Simulation examples"
  contents:
  - spacelink_vignette
  - spacelink_ctSVG_vignette
  - lengthscale_estimation
  - runtime_memory_usage

- title: "Real data analyses"
  desc: "Detailed example analyses on real datasets"
  contents:
  - illustration_on_cosmx_data
  - illustration_on_visium_data
  - disease_informativeness_evaluation
  - AD_data_analysis

- title: "Data browser"
  desc: "Interactive exploration of the example datasets"
  contents:
  - articles/data_browser

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: |
      Developed by Hanbyul Lee, Haochen Sun, Xuewei Cao, Kushal Dey.
    built_with: |
      Built with [pkgdown](https://pkgdown.r-lib.org/).

